name: Refresh pricing snapshot

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Regenerate snapshot
        run: go generate ./internal/pricing/...
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Refresh LiteLLM pricing snapshot"
          branch: chore/refresh-pricing
          delete-branch: true
          title: "Refresh LiteLLM pricing snapshot"
          body: |
            Automated weekly refresh of `internal/pricing/litellm-snapshot.json`
            from `BerriAI/litellm`. Review the diff for unexpected model removals
            or pricing changes before merging.
          add-paths: |
            internal/pricing/litellm-snapshot.json
